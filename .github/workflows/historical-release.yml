name: Historical Stable release
on:
  push:
    tags: [legacy-stable-container-r3]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: historical-stable-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'IAmEidrien/tasks-in-panel-adaptive'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/legacy-stable-container-r3
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3 libglib2.0-bin
      - run: python3 tools/package_legacy.py
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const tag = 'legacy-stable-container-r3';
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag,
                name: 'Stable Container R3 — historical build', draft: false,
                prerelease: true, make_latest: 'false',
                body: 'Historical Stable Container R3 build (version 5903), based on Tasks in Panel v59. Runtime files and settings match the former Stable build; the upcoming Adaptive redesign is not included. The ZIP retains tasks-in-panel@fthx and its existing schema. Disable/remove an existing copy before installing; do not overwrite a Git-managed checkout. Metadata retains GNOME 46–49 declarations, without new native compatibility claims. GPLv3 and upstream attribution are preserved. SHA256SUMS verifies the installable ZIP.'})).data;
            }
            for (const name of fs.readdirSync('dist')) {
              const old = release.assets.find(asset => asset.name === name);
              if (old) {
                core.info(`Preserving existing historical asset ${name}`);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id,
                name, data: fs.readFileSync(`dist/${name}`)});
            }
